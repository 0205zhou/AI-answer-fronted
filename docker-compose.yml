version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: ai-chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_chat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-java
    container_name: ai-chat-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ai_chat
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      JWT_SECRET: replace-with-at-least-32-chars-secret-key-123456
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      BAILIAN_MODEL: qwen-plus
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-chat-frontend
    restart: unless-stopped
    depends_on:
      - mysql
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
      DATABASE_URL: mysql://root:root@mysql:3306/ai_chat
    ports:
      - "3000:3000"

volumes:
  mysql_data: